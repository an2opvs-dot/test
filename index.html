<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exported Site</title>
  <style>
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background-color: #ffffff; }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
    <section style="padding: 60px 20px; text-align: center; background-color: #f8f9fa">
      <h1 style="font-size: 2.5rem; margin-bottom: 16px">Welcome to Our Platform</h1>
      <p style="color: #666; max-width: 600px; margin: 0 auto">A descriptive catchy subtitle goes here.</p>
    </section>
    <section style="padding: 40px 20px; background-color: #ffffff">
      <h2 style="text-align: center; margin-bottom: 16px">Contact Us</h2>
      <div style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px">
        <input type="text" placeholder="Name" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc" />
        <input type="email" placeholder="Email" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc" />
        <button style="padding: 10px; background-color: #3b82f6; color: white; border: none; border-radius: 4px">Submit</button>
      </div>
    </section>
    <section style="padding: 40px 20px; background-color: #ffffff">
      <h2 style="text-align: center; margin-bottom: 24px">Features</h2>
      <div style="display: flex; gap: 20px; justify-content: center">
        <div style="width: 30%; height: 100px; background: #f1f3f5; border-radius: 4px; padding: 16px">Feature Box</div>
        <div style="width: 30%; height: 100px; background: #f1f3f5; border-radius: 4px; padding: 16px">Feature Box</div>
      </div>
    </section>
</body>
</html>
